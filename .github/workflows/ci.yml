name: CI

on:
  push:
  pull_request:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  python-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r services/nsi/requirements.txt -r services/documents/requirements.txt -r services/conversion/requirements.txt -r services/e2e/requirements.txt
      - run: python -m compileall services
      - run: pytest -q --collect-only services/e2e/tests

  e2e-smoke:
    runs-on: ubuntu-latest
    needs:
      - frontend-build
      - python-smoke
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build keycloak_db keycloak rabbitmq minio nsi_db documents_db nsi documents documents_worker conversion seed
      - run: docker compose run --rm e2e
      - if: always()
        run: docker compose down -v
