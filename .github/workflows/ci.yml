name: CI

on:
  push:
  pull_request:

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint:strict
      - run: npm run build

  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r services/nsi/requirements.txt -r services/documents/requirements.txt -r services/conversion/requirements.txt -r services/e2e/requirements.txt
      - run: pip install ruff
      - run: python -m compileall services
      - run: ruff check services/nsi/apps services/nsi/nsi_service services/documents/apps services/documents/documents_service services/conversion/app
      - name: Django checks (NSI)
        env:
          DATABASE_URL: sqlite:////tmp/nsi.sqlite3
          KEYCLOAK_ISSUER: http://localhost/realms/uom
          KEYCLOAK_JWKS_URL: http://localhost/jwks
          DJANGO_SECRET_KEY: ci-secret
          DJANGO_DEBUG: "0"
        working-directory: services/nsi
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Django checks (Documents)
        env:
          DATABASE_URL: sqlite:////tmp/documents.sqlite3
          KEYCLOAK_ISSUER: http://localhost/realms/uom
          KEYCLOAK_JWKS_URL: http://localhost/jwks
          DJANGO_SECRET_KEY: ci-secret
          DJANGO_DEBUG: "0"
        working-directory: services/documents
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - run: pytest -q --collect-only services/e2e/tests

  e2e-smoke:
    runs-on: ubuntu-latest
    needs:
      - frontend-quality
      - backend-quality
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build keycloak_db keycloak rabbitmq minio nsi_db documents_db nsi documents documents_worker conversion seed
      - run: docker compose run --rm e2e
      - if: always()
        run: docker compose down -v
