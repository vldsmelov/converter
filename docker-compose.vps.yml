# Прод-ориентированный стек для VPS за reverse proxy (Nginx на хосте).
#
# Зачем отдельный файл (СБ / GitOps):
# - docker-compose.yml в корне — для локальной разработки (порты на 0.0.0.0, dev-секреты).
# - Этот файл — эталон «как должно быть на сервере»: наружу только хостовой 443, приложения
#   доступны с хоста по 127.0.0.1 для Nginx, без публикации БД/очереди/MinIO в интернет.
#
# Форк (vvv-web/converter) — полигон: правки СБ можно мержить в upstream test после проверки.
# Сверка с каноном: git fetch origin test && git fetch fork test && git rev-parse origin/test fork/test
#
# Запуск: скопировать deploy/vps/.env.example → deploy/vps/.env и задать секреты,
# затем: docker compose -f docker-compose.vps.yml up -d --build
#
# Версии образов зафиксированы (не :latest) — требование прослеживаемости для СБ; перед bump
# сверять release notes Keycloak / MinIO / RabbitMQ.

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    # Без publish на 0.0.0.0 — только внутренняя сеть compose

  minio:
    # Зафиксированный release (не latest) — воспроизводимые билды и проще отчёт для СБ.
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  keycloak_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER:?set KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_db:/var/lib/postgresql/data

  keycloak:
    # start (не start-dev): prod-режим Keycloak. --import-realm: из ./infra/keycloak (только при первом старте realm).
    image: quay.io/keycloak/keycloak:26.0.8
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?set KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak_db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?set KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      - keycloak_db

  nsi_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nsi
      POSTGRES_USER: ${NSI_DB_USER:?set NSI_DB_USER}
      POSTGRES_PASSWORD: ${NSI_DB_PASSWORD:?set NSI_DB_PASSWORD}
    volumes:
      - nsi_db:/var/lib/postgresql/data

  documents_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: documents
      POSTGRES_USER: ${DOCUMENTS_DB_USER:?set DOCUMENTS_DB_USER}
      POSTGRES_PASSWORD: ${DOCUMENTS_DB_PASSWORD:?set DOCUMENTS_DB_PASSWORD}
    volumes:
      - documents_db:/var/lib/postgresql/data

  nsi:
    build: ./services/nsi
    restart: unless-stopped
    env_file:
      - deploy/vps/.env
    environment:
      DJANGO_SECRET_KEY: ${NSI_DJANGO_SECRET_KEY:?set NSI_DJANGO_SECRET_KEY}
      DATABASE_URL: ${NSI_DATABASE_URL:?set NSI_DATABASE_URL}
      DJANGO_DEBUG: "0"
      ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:?set KEYCLOAK_ISSUER}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:?set KEYCLOAK_JWKS_URL}
      KEYCLOAK_ADMIN_BASE_URL: ${KEYCLOAK_ADMIN_BASE_URL:?set KEYCLOAK_ADMIN_BASE_URL}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_ADMIN_REALM:-uom}
      KEYCLOAK_ADMIN_AUTH_REALM: ${KEYCLOAK_ADMIN_AUTH_REALM:-master}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-admin-cli}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      - nsi_db
      - keycloak
    command: >-
      sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"

  documents:
    build: ./services/documents
    restart: unless-stopped
    env_file:
      - deploy/vps/.env
    environment:
      DJANGO_SECRET_KEY: ${DOCS_DJANGO_SECRET_KEY:?set DOCS_DJANGO_SECRET_KEY}
      DATABASE_URL: ${DOCUMENTS_DATABASE_URL:?set DOCUMENTS_DATABASE_URL}
      DJANGO_DEBUG: "0"
      ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:?set KEYCLOAK_ISSUER}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:?set KEYCLOAK_JWKS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?set CELERY_BROKER_URL}
      CONVERSION_BASE_URL: ${CONVERSION_BASE_URL:?set CONVERSION_BASE_URL}
      KEYCLOAK_TOKEN_URL: ${KEYCLOAK_TOKEN_URL:?set KEYCLOAK_TOKEN_URL}
      S2S_CLIENT_ID: ${S2S_CLIENT_ID:-documents-service}
      S2S_CLIENT_SECRET: ${S2S_CLIENT_SECRET:?set S2S_CLIENT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?set MINIO_PUBLIC_ENDPOINT}
      MINIO_PUBLIC_SECURE: ${MINIO_PUBLIC_SECURE:-1}
      MINIO_INTERNAL_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT:-minio:9000}
      # Внутренний клиент MinIO (см. documents_core/storage.py): отдельно от «публичного» presign.
      MINIO_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT:-minio:9000}
      MINIO_SECURE: "0"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      # Только loopback: наружу выходит Nginx на хосте (TLS), не Django.
      - "127.0.0.1:8002:8000"
    depends_on:
      - documents_db
      - rabbitmq
      - keycloak
      - minio
    command: >-
      sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"

  documents_worker:
    build: ./services/documents
    restart: unless-stopped
    env_file:
      - deploy/vps/.env
    environment:
      DJANGO_SECRET_KEY: ${DOCS_DJANGO_SECRET_KEY:?set DOCS_DJANGO_SECRET_KEY}
      DATABASE_URL: ${DOCUMENTS_DATABASE_URL:?set DOCUMENTS_DATABASE_URL}
      DJANGO_DEBUG: "0"
      ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:?set KEYCLOAK_ISSUER}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:?set KEYCLOAK_JWKS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?set CELERY_BROKER_URL}
      CONVERSION_BASE_URL: ${CONVERSION_BASE_URL:?set CONVERSION_BASE_URL}
      KEYCLOAK_TOKEN_URL: ${KEYCLOAK_TOKEN_URL:?set KEYCLOAK_TOKEN_URL}
      S2S_CLIENT_ID: ${S2S_CLIENT_ID:-documents-service}
      S2S_CLIENT_SECRET: ${S2S_CLIENT_SECRET:?set S2S_CLIENT_SECRET}
      MINIO_INTERNAL_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT:-minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?set MINIO_PUBLIC_ENDPOINT}
      MINIO_PUBLIC_SECURE: ${MINIO_PUBLIC_SECURE:-1}
      MINIO_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT:-minio:9000}
      MINIO_SECURE: "0"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    depends_on:
      - documents_db
      - rabbitmq
    command: >-
      sh -c "python manage.py migrate --noinput && celery -A documents_service worker -l info"

  conversion:
    build: ./services/conversion
    restart: unless-stopped
    env_file:
      - deploy/vps/.env
    environment:
      NSI_BASE_URL: ${NSI_BASE_URL:?set NSI_BASE_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:?set KEYCLOAK_ISSUER}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:?set KEYCLOAK_JWKS_URL}
    ports:
      - "127.0.0.1:8003:8000"
    depends_on:
      - nsi

  seed:
    build: ./services/seed
    profiles: ["bootstrap"]
    env_file:
      - deploy/vps/.env
    environment:
      KEYCLOAK_URL: ${KEYCLOAK_INTERNAL_URL:?set KEYCLOAK_INTERNAL_URL}
      NSI_URL: ${NSI_INTERNAL_URL:?set NSI_INTERNAL_URL}
      DOCS_URL: ${DOCUMENTS_INTERNAL_URL:?set DOCUMENTS_INTERNAL_URL}
      SEED_USERNAME: ${SEED_USERNAME:-operator}
      SEED_PASSWORD: ${SEED_PASSWORD:?set SEED_PASSWORD}
      SEED_CLIENT_ID: ${SEED_CLIENT_ID:-uom-cli}
    depends_on:
      - keycloak
      - nsi
      - documents
    restart: "no"

volumes:
  keycloak_db:
  nsi_db:
  documents_db:
  minio_data:
